name: API Tests

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - local
          - docker
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: tests/postman/package-lock.json

      - name: Install Newman and dependencies
        working-directory: tests/postman
        run: npm ci

      - name: Start services with Docker Compose
        run: docker compose up -d --build

      - name: Wait for services
        run: |
          for i in {1..45}; do
            curl -fsS http://localhost:8080/health >/dev/null 2>&1 && \
            curl -fsS http://localhost:8081/api/movies/health >/dev/null 2>&1 && \
            curl -fsS http://localhost:8082/api/events/health >/dev/null 2>&1 && \
            curl -fsS http://localhost:8000/health >/dev/null 2>&1 && exit 0
            echo "Waiting for services to become healthy..."
            sleep 4
          done
          echo "Services did not become healthy in time"
          docker compose ps
          exit 1

      - name: Run API tests
        working-directory: tests/postman
        run: npm run test:local

      - name: Stop services
        if: always()
        run: docker compose down -v